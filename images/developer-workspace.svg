<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1000" width="100%" height="100%">
  <defs>
    <!-- Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080C1B"/>
      <stop offset="50%" stop-color="#0D1328"/>
      <stop offset="100%" stop-color="#050814"/>
    </linearGradient>

    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#101835" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#090E20" stop-opacity="0.95"/>
    </linearGradient>

    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F0FF"/>
      <stop offset="100%" stop-color="#0072FF"/>
    </linearGradient>

    <linearGradient id="purpleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#A78BFA"/>
      <stop offset="100%" stop-color="#6D28D9"/>
    </linearGradient>

    <linearGradient id="accentBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F0FF" stop-opacity="0.7"/>
      <stop offset="50%" stop-color="#8B5CF6" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#00F0FF" stop-opacity="0.1"/>
    </linearGradient>

    <!-- Filters -->
    <filter id="cyanGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="softGlow" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <pattern id="gridPattern" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#00F0FF" stroke-opacity="0.04" stroke-width="1"/>
    </pattern>
  </defs>

  <style>
    .mono { font-family: 'JetBrains Mono', 'Courier New', monospace; }
    .sans { font-family: 'Space Grotesk', -apple-system, sans-serif; }
    .t-comm { fill: #64748B; font-style: italic; }
    .t-kw   { fill: #F43F5E; font-weight: bold; }
    .t-var  { fill: #38BDF8; }
    .t-prop { fill: #E2E8F0; }
    .t-str  { fill: #34D399; }
    .t-fn   { fill: #FBBF24; font-weight: bold; }
    .t-num  { fill: #A78BFA; }
    .t-punct{ fill: #94A3B8; }
  </style>

  <!-- Background -->
  <rect width="800" height="1000" fill="url(#bgGrad)"/>
  <rect width="800" height="1000" fill="url(#gridPattern)"/>

  <!-- Ambient Light Orbs -->
  <circle cx="700" cy="150" r="180" fill="#00F0FF" fill-opacity="0.08" filter="url(#cyanGlow)"/>
  <circle cx="100" cy="850" r="220" fill="#8B5CF6" fill-opacity="0.1" filter="url(#cyanGlow)"/>

  <!-- Top Decorative Tech Header -->
  <g transform="translate(40, 40)">
    <rect width="720" height="44" rx="8" fill="#0C1226" stroke="#00F0FF" stroke-opacity="0.25" stroke-width="1"/>
    <!-- Status Dot -->
    <circle cx="24" cy="22" r="5" fill="#00F0FF" filter="url(#softGlow)"/>
    <text x="38" y="27" fill="#00F0FF" class="mono" font-size="12" font-weight="700" letter-spacing="1">KODIGO WORKSTATION // ENRIQUEZ.LAB</text>
    <rect x="580" y="12" width="124" height="20" rx="4" fill="#00F0FF" fill-opacity="0.1" stroke="#00F0FF" stroke-opacity="0.3"/>
    <text x="642" y="26" fill="#38BDF8" class="mono" font-size="10" font-weight="700" text-anchor="middle">PORAC • PAMPANGA</text>
  </g>

  <!-- IDE Window Frame -->
  <g transform="translate(40, 105)">
    <!-- Shadow & Main Window -->
    <rect width="720" height="660" rx="14" fill="url(#cardGrad)" stroke="url(#accentBorder)" stroke-width="1.5"/>

    <!-- Window Titlebar -->
    <path d="M 0 14 Q 0 0 14 0 L 706 0 Q 720 0 720 14 L 720 48 L 0 48 Z" fill="#090E20" stroke="#00F0FF" stroke-opacity="0.15" stroke-width="1"/>
    <circle cx="24" cy="24" r="6" fill="#EF4444" fill-opacity="0.8"/>
    <circle cx="44" cy="24" r="6" fill="#F59E0B" fill-opacity="0.8"/>
    <circle cx="64" cy="24" r="6" fill="#10B981" fill-opacity="0.8"/>

    <!-- Tabs -->
    <rect x="95" y="10" width="160" height="38" rx="6" fill="#121B3A" stroke="#00F0FF" stroke-opacity="0.3" stroke-width="1"/>
    <text x="175" y="34" fill="#E2E8F0" class="mono" font-size="12" font-weight="600" text-anchor="middle">studio-core.js</text>

    <text x="320" y="34" fill="#64748B" class="mono" font-size="12">style.css</text>
    <text x="440" y="34" fill="#64748B" class="mono" font-size="12">portfolio.html</text>

    <!-- Editor Body -->
    <g transform="translate(24, 75)" class="mono" font-size="13.5">
      <!-- Line Numbers Column -->
      <g fill="#475569" font-size="12" text-anchor="end">
        <text x="25" y="24">01</text>
        <text x="25" y="52">02</text>
        <text x="25" y="80">03</text>
        <text x="25" y="108">04</text>
        <text x="25" y="136">05</text>
        <text x="25" y="164">06</text>
        <text x="25" y="192">07</text>
        <text x="25" y="220">08</text>
        <text x="25" y="248">09</text>
        <text x="25" y="276">10</text>
        <text x="25" y="304">11</text>
        <text x="25" y="332">12</text>
        <text x="25" y="360">13</text>
        <text x="25" y="388">14</text>
        <text x="25" y="416">15</text>
        <text x="25" y="444">16</text>
        <text x="25" y="472">17</text>
        <text x="25" y="500">18</text>
        <text x="25" y="528">19</text>
      </g>

      <!-- Code Divider -->
      <line x1="38" y1="5" x2="38" y2="540" stroke="#1E293B" stroke-width="1"/>

      <!-- Code Text Content -->
      <g transform="translate(50, 0)">
        <!-- Line 01 -->
        <text x="0" y="24" class="t-comm">// Kodigo Web Studio — Engineering Architecture</text>

        <!-- Line 02 -->
        <text x="0" y="52"><tspan class="t-kw">import</tspan> <tspan class="t-punct">{</tspan> <tspan class="t-var">StudioEngine</tspan> <tspan class="t-punct">}</tspan> <tspan class="t-kw">from</tspan> <tspan class="t-str">"@kodigo/core"</tspan><tspan class="t-punct">;</tspan></text>

        <!-- Line 03 -->
        <text x="0" y="80"/>

        <!-- Line 04 -->
        <text x="0" y="108"><tspan class="t-kw">export const</tspan> <tspan class="t-var">leadDeveloper</tspan> <tspan class="t-punct">=</tspan> <tspan class="t-punct">{</tspan></text>

        <!-- Line 05 -->
        <text x="20" y="136"><tspan class="t-prop">name</tspan><tspan class="t-punct">:</tspan> <tspan class="t-str">"Carl Benedict C. Enriquez"</tspan><tspan class="t-punct">,</tspan></text>

        <!-- Line 06 -->
        <text x="20" y="164"><tspan class="t-prop">program</tspan><tspan class="t-punct">:</tspan> <tspan class="t-str">"BS Computer Science"</tspan><tspan class="t-punct">,</tspan></text>

        <!-- Line 07 -->
        <text x="20" y="192"><tspan class="t-prop">location</tspan><tspan class="t-punct">:</tspan> <tspan class="t-str">"Porac, Pampanga, PH"</tspan><tspan class="t-punct">,</tspan></text>

        <!-- Line 08 -->
        <text x="20" y="220"><tspan class="t-prop">techStack</tspan><tspan class="t-punct">:</tspan> <tspan class="t-punct">[</tspan><tspan class="t-str">"HTML5"</tspan><tspan class="t-punct">, </tspan><tspan class="t-str">"CSS3"</tspan><tspan class="t-punct">, </tspan><tspan class="t-str">"JS"</tspan><tspan class="t-punct">, </tspan><tspan class="t-str">"Bootstrap"</tspan><tspan class="t-punct">],</tspan></text>

        <!-- Line 09 -->
        <text x="20" y="248"><tspan class="t-prop">handCrafted</tspan><tspan class="t-punct">:</tspan> <tspan class="t-kw">true</tspan><tspan class="t-punct">,</tspan>  <tspan class="t-comm">// No template bloat</tspan></text>

        <!-- Line 10 -->
        <text x="0" y="276"><tspan class="t-punct">};</tspan></text>

        <!-- Line 11 -->
        <text x="0" y="304"/>

        <!-- Line 12 -->
        <text x="0" y="332"><tspan class="t-kw">export async function</tspan> <tspan class="t-fn">buildClientVenture</tspan><tspan class="t-punct">(</tspan><tspan class="t-var">shop</tspan><tspan class="t-punct">) {</tspan></text>

        <!-- Line 13 -->
        <text x="20" y="360"><tspan class="t-kw">const</tspan> <tspan class="t-var">site</tspan> <tspan class="t-punct">=</tspan> <tspan class="t-kw">await</tspan> <tspan class="t-fn">compileResponsiveSite</tspan><tspan class="t-punct">({</tspan></text>

        <!-- Line 14 -->
        <text x="40" y="388"><tspan class="t-prop">client</tspan><tspan class="t-punct">:</tspan> <tspan class="t-var">shop</tspan><tspan class="t-punct">.</tspan><tspan class="t-prop">name</tspan><tspan class="t-punct">,</tspan></text>

        <!-- Line 15 -->
        <text x="40" y="416"><tspan class="t-prop">mobileFirst</tspan><tspan class="t-punct">:</tspan> <tspan class="t-kw">true</tspan><tspan class="t-punct">,</tspan></text>

        <!-- Line 16 -->
        <text x="40" y="444"><tspan class="t-prop">freeHosting</tspan><tspan class="t-punct">:</tspan> <tspan class="t-str">"GitHub Pages / Netlify"</tspan><tspan class="t-punct">,</tspan></text>

        <!-- Line 17 -->
        <text x="40" y="472"><tspan class="t-prop">delivery</tspan><tspan class="t-punct">:</tspan> <tspan class="t-str">"5 - 14 Business Days"</tspan></text>

        <!-- Line 18 -->
        <text x="20" y="500"><tspan class="t-punct">});</tspan></text>

        <!-- Line 19 -->
        <text x="20" y="528"><tspan class="t-kw">return</tspan> <tspan class="t-var">site</tspan><tspan class="t-punct">.</tspan><tspan class="t-fn">publishLive</tspan><tspan class="t-punct">();</tspan></text>
      </g>
    </g>
  </g>

  <!-- Bottom Telemetry Card: Responsive Viewports & Metrics -->
  <g transform="translate(40, 785)">
    <rect width="720" height="175" rx="12" fill="#0A0E22" stroke="#00F0FF" stroke-opacity="0.3" stroke-width="1"/>

    <!-- Left Box: Viewport Devices Representation -->
    <g transform="translate(24, 22)">
      <!-- Desktop Monitor -->
      <rect x="0" y="10" width="120" height="75" rx="4" fill="#111833" stroke="#38BDF8" stroke-width="1.5"/>
      <line x1="60" y1="85" x2="60" y2="105" stroke="#38BDF8" stroke-width="2"/>
      <line x1="40" y1="105" x2="80" y2="105" stroke="#38BDF8" stroke-width="2"/>
      <rect x="10" y="20" width="100" height="55" fill="#00F0FF" fill-opacity="0.08"/>

      <!-- Tablet -->
      <rect x="135" y="25" width="55" height="80" rx="4" fill="#111833" stroke="#8B5CF6" stroke-width="1.5"/>
      <rect x="142" y="35" width="41" height="60" fill="#8B5CF6" fill-opacity="0.08"/>

      <!-- Mobile Phone -->
      <rect x="202" y="40" width="38" height="65" rx="5" fill="#111833" stroke="#00F0FF" stroke-width="1.5"/>
      <rect x="207" y="48" width="28" height="49" fill="#00F0FF" fill-opacity="0.12"/>
      <circle cx="221" cy="99" r="1.5" fill="#00F0FF"/>

      <text x="0" y="132" fill="#94A3B8" class="mono" font-size="11">RESPONSIVE LAYOUT STUDY</text>
    </g>

    <!-- Center/Right: Live Metrics -->
    <g transform="translate(290, 25)">
      <line x1="0" y1="5" x2="0" y2="120" stroke="#1E293B" stroke-width="1"/>

      <g transform="translate(25, 0)">
        <text x="0" y="16" fill="#64748B" class="mono" font-size="10" font-weight="700" letter-spacing="1">DESIGN PRIORITIES</text>

        <!-- Metric 1 -->
        <text x="0" y="46" fill="#F1F5F9" class="sans" font-size="20" font-weight="700">Clear</text>
        <text x="0" y="62" fill="#94A3B8" class="mono" font-size="10">PAGE CONTENT</text>

        <!-- Metric 2 -->
        <text x="140" y="46" fill="#F1F5F9" class="sans" font-size="20" font-weight="700">Simple</text>
        <text x="140" y="62" fill="#94A3B8" class="mono" font-size="10">NAVIGATION</text>

        <!-- Metric 3 -->
        <text x="280" y="46" fill="#F1F5F9" class="sans" font-size="20" font-weight="700">Mobile</text>
        <text x="280" y="62" fill="#94A3B8" class="mono" font-size="10">FRIENDLY LAYOUT</text>

        <!-- Tech Pills -->
        <g transform="translate(0, 85)">
          <rect x="0" y="0" width="70" height="22" rx="4" fill="#00F0FF" fill-opacity="0.1" stroke="#00F0FF" stroke-opacity="0.4"/>
          <text x="35" y="15" fill="#00F0FF" class="mono" font-size="10" font-weight="700" text-anchor="middle">HTML5</text>

          <rect x="78" y="0" width="65" height="22" rx="4" fill="#3B82F6" fill-opacity="0.1" stroke="#3B82F6" stroke-opacity="0.4"/>
          <text x="110" y="15" fill="#38BDF8" class="mono" font-size="10" font-weight="700" text-anchor="middle">CSS3</text>

          <rect x="151" y="0" width="55" height="22" rx="4" fill="#FBBF24" fill-opacity="0.1" stroke="#FBBF24" stroke-opacity="0.4"/>
          <text x="178" y="15" fill="#FBBF24" class="mono" font-size="10" font-weight="700" text-anchor="middle">JS</text>

          <rect x="214" y="0" width="95" height="22" rx="4" fill="#8B5CF6" fill-opacity="0.1" stroke="#8B5CF6" stroke-opacity="0.4"/>
          <text x="261" y="15" fill="#A78BFA" class="mono" font-size="10" font-weight="700" text-anchor="middle">BOOTSTRAP 5</text>
        </g>
      </g>
    </g>
  </g>
</svg>
