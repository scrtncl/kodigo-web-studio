<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 650" width="780" height="650" fill="none" role="img" aria-labelledby="blueprintTitle blueprintDesc">
  <title id="blueprintTitle">From local shop to a useful website</title>
  <desc id="blueprintDesc">An illustrative bakery website with a clear menu, warm bread illustrations, and a matching phone layout. Blueprint annotations connect content, layout, and getting in touch. This is a sample design, not a client project.</desc>
  <defs>
    <pattern id="blueprintGrid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" stroke="#86efef" stroke-opacity=".055"/>
    </pattern>
    <linearGradient id="blueprintGround" x1="34" y1="0" x2="704" y2="650" gradientUnits="userSpaceOnUse">
      <stop stop-color="#102632"/>
      <stop offset="1" stop-color="#08121b"/>
    </linearGradient>
    <linearGradient id="breadCrust" x1="0" y1="0" x2="0" y2="100">
      <stop stop-color="#d9a263"/>
      <stop offset="1" stop-color="#bc7c42"/>
    </linearGradient>
    <filter id="panelShadow" x="-20%" y="-20%" width="150%" height="160%">
      <feDropShadow dx="0" dy="18" stdDeviation="20" flood-color="#000" flood-opacity=".35"/>
    </filter>
  </defs>

  <!-- A drawing board, not a fictional performance dashboard. -->
  <rect x="1" y="1" width="778" height="648" rx="24" fill="url(#blueprintGround)" stroke="#86efef" stroke-opacity=".14"/>
  <rect x="1" y="1" width="778" height="648" rx="24" fill="url(#blueprintGrid)"/>
  <path d="M25 58V25H58M722 25H755V58M25 592V625H58M722 625H755V592" stroke="#86efef" stroke-opacity=".45"/>

  <g font-family="'Courier New',monospace" font-size="14" letter-spacing="1.2">
    <text x="48" y="62" fill="#86efef">01 / CONTENT</text>
    <text x="480" y="62" fill="#b1c5cd">02 / LAYOUT</text>
  </g>
  <path d="M48 76H215L239 100M480 76H643V100" stroke="#86efef" stroke-opacity=".5"/>
  <circle cx="239" cy="100" r="3" fill="#86efef"/>
  <circle cx="643" cy="100" r="3" fill="#86efef"/>

  <!-- Desktop browser: a deliberately simple local bakery concept. -->
  <g filter="url(#panelShadow)">
    <rect x="49" y="112" width="622" height="397" rx="12" fill="#f2e9d6" stroke="#63858d"/>
    <path d="M61 112H659A12 12 0 0 1 671 124V152H49V124A12 12 0 0 1 61 112Z" fill="#152c38"/>
    <circle cx="70" cy="132" r="3" fill="#dd9c8d"/>
    <circle cx="83" cy="132" r="3" fill="#d4bd8c"/>
    <circle cx="96" cy="132" r="3" fill="#86efef"/>
    <text x="125" y="137" fill="#c1d5db" font-family="'Courier New',monospace" font-size="12" letter-spacing="1">SAMPLE WEBSITE / CONCEPT</text>
    <path d="M636 126L642 132L636 138M654 126L648 132L654 138" stroke="#86efef" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>

    <g font-family="Arial,Helvetica,sans-serif">
      <text x="76" y="188" fill="#263c35" font-size="19" font-weight="700" letter-spacing="-.5">The neighbourhood bakery.</text>
      <text x="546" y="187" fill="#5f6659" font-size="13">Menu</text>
      <text x="604" y="187" fill="#5f6659" font-size="13">Visit</text>
      <path d="M76 206H644" stroke="#263c35" stroke-opacity=".18"/>

      <text x="76" y="245" fill="#7a6347" font-size="11" font-weight="700" letter-spacing="2">FRESH FROM OUR OVEN</text>
      <text x="76" y="282" fill="#263c35" font-size="34" font-weight="700" letter-spacing="-1.4">A little warmth.</text>
      <text x="76" y="319" fill="#263c35" font-size="34" font-weight="700" letter-spacing="-1.4">Every morning.</text>
      <text x="77" y="350" fill="#676b5d" font-size="15">Your favourite breads, all in one place.</text>
      <rect x="76" y="371" width="143" height="36" rx="4" fill="#324b40"/>
      <text x="92" y="394" fill="#fff6e6" font-size="13" font-weight="700">Explore the menu</text>
      <path d="M204 384L210 389L204 394" stroke="#f2e9d6" stroke-width="1.3"/>
    </g>

    <!-- Original vector still-life: loaf, bun, and leaf on a warm plate. -->
    <ellipse cx="523" cy="320" rx="106" ry="87" fill="#e4d6b9"/>
    <ellipse cx="523" cy="332" rx="88" ry="62" fill="#eee1c8" stroke="#cbb99a"/>
    <ellipse cx="511" cy="345" rx="67" ry="28" fill="#a77a4a" fill-opacity=".16"/>
    <path d="M450 316C447 286 473 265 505 268C538 263 572 280 575 306C580 331 552 349 517 350C483 351 451 339 450 316Z" fill="#c68d50"/>
    <path d="M462 305C466 280 498 274 519 278C545 279 561 291 564 306C553 323 528 331 504 330C482 329 467 320 462 305Z" fill="#dfae70"/>
    <path d="M478 286C477 298 483 309 492 315M501 280C500 294 505 305 514 313M525 282C524 293 531 304 537 307" stroke="#f5d8a2" stroke-width="6" stroke-linecap="round"/>
    <circle cx="572" cy="346" r="29" fill="#ba7c41"/>
    <circle cx="570" cy="341" r="27" fill="#d5a365"/>
    <path d="M553 337C562 329 574 328 585 336M568 321C562 332 562 348 571 358" stroke="#f0cc94" stroke-width="3" stroke-linecap="round"/>
    <path d="M440 352Q428 330 438 314Q455 326 440 352M440 352Q459 337 472 345Q462 359 440 352" fill="#6d8060"/>
    <path d="M442 351L427 367" stroke="#6d8060" stroke-width="2"/>

    <path d="M76 433H515" stroke="#263c35" stroke-opacity=".18"/>
    <g font-family="Arial,Helvetica,sans-serif" font-size="13" fill="#5f6659">
      <text x="76" y="465">Clear menu</text><text x="206" y="465">Easy directions</text><text x="365" y="465">Direct inquiries</text>
    </g>
    <circle cx="173" cy="460" r="2" fill="#9a9c82"/>
    <circle cx="334" cy="460" r="2" fill="#9a9c82"/>
  </g>

  <!-- Connected mobile view, deliberately large enough to read. -->
  <g filter="url(#panelShadow)">
    <rect x="546" y="339" width="184" height="279" rx="26" fill="#0a1720" stroke="#86efef" stroke-opacity=".8"/>
    <rect x="554" y="347" width="168" height="263" rx="19" fill="#f2e9d6"/>
    <rect x="613" y="352" width="50" height="8" rx="4" fill="#0a1720"/>
    <g font-family="Arial,Helvetica,sans-serif">
      <text x="568" y="389" fill="#263c35" font-size="15" font-weight="700">Fresh &amp; local.</text>
      <path d="M693 379H707M693 384H707M693 389H707" stroke="#263c35" stroke-width="1.3"/>
      <path d="M568 402H707" stroke="#263c35" stroke-opacity=".18"/>
      <text x="568" y="428" fill="#263c35" font-size="20" font-weight="700" letter-spacing="-.5">Today’s menu</text>
      <rect x="568" y="443" width="139" height="64" rx="7" fill="#e2d5b9"/>
      <ellipse cx="602" cy="478" rx="23" ry="16" fill="#d4a065"/>
      <path d="M592 466L599 484M604 464L612 481" stroke="#f0d09c" stroke-width="3" stroke-linecap="round"/>
      <text x="636" y="473" fill="#3f4a3c" font-size="12" font-weight="700">Pandesal</text>
      <text x="636" y="490" fill="#6a6c5b" font-size="11">Oven-fresh</text>
      <text x="568" y="532" fill="#626957" font-size="12">See something you like?</text>
      <rect x="568" y="546" width="139" height="37" rx="5" fill="#324b40"/>
      <text x="580" y="570" fill="#fff6e6" font-size="13" font-weight="700">Message to order</text>
    </g>
    <rect x="615" y="597" width="46" height="3" rx="1.5" fill="#738071"/>
  </g>

  <g font-family="'Courier New',monospace">
    <text x="49" y="559" fill="#86efef" font-size="14" letter-spacing="1.2">03 / CONNECT</text>
    <text x="49" y="585" fill="#b1c5cd" font-size="13">Built around real people.</text>
  </g>
  <path d="M284 555H490L520 575H546" stroke="#86efef" stroke-opacity=".55"/>
  <circle cx="284" cy="555" r="3" fill="#86efef"/>
  <path d="M535 570L541 575L535 580" stroke="#86efef" stroke-width="1.5"/>
</svg>
